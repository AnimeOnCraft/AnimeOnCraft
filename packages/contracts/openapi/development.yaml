openapi: 3.1.0
info:
  title: AnimeOnCraft Local Development Base API
  version: 0.4.0-auth-dev
  description: Explicit AOC_LOCAL_BASE_API=true, development mode and 127.0.0.1 only. No user authentication; never expose this API through a proxy. DELETE archives only clans without linked history. Real management workflows arrive after authentication.
servers:
  - url: http://127.0.0.1:3000/development/v1
paths:
  /clans:
    get:
      operationId: localListClans
      responses:
        '200':
          description: At most 100 local records, including disabled and archived records.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/ClanRecord' } }
        '503': { $ref: '#/components/responses/Error' }
    post:
      operationId: localCreateClan
      requestBody: { $ref: '#/components/requestBodies/Clan' }
      responses:
        '201': { $ref: '#/components/responses/Clan' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /clans/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: localGetClan
      responses:
        '200': { $ref: '#/components/responses/Clan' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    put:
      operationId: localUpdateClan
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody: { $ref: '#/components/requestBodies/Clan' }
      responses:
        '200': { $ref: '#/components/responses/Clan' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    delete:
      operationId: localArchiveEmptyClan
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      responses:
        '200': { $ref: '#/components/responses/Clan' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
components:
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string, pattern: '^"(0|[1-9][0-9]{0,18})"$' }
  requestBodies:
    Clan:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ClanInput' }
  responses:
    Clan:
      description: Local record with decimal version.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ClanRecord' }
    Error:
      description: Validation, conflict, stale/missing precondition or dependency error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    ClanInput:
      type: object
      additionalProperties: false
      required: [name, short_code, description, discord_url, enabled]
      properties:
        name: { type: string, minLength: 2, maxLength: 64 }
        short_code: { type: string, pattern: '^[A-Z0-9]{2,12}$' }
        description: { type: string, maxLength: 4000 }
        discord_url: { type: [string, 'null'], maxLength: 256, pattern: '^https://(discord\.gg/[A-Za-z0-9-]+|discord\.com/invite/[A-Za-z0-9-]+)$' }
        enabled: { type: boolean }
    ClanRecord:
      type: object
      additionalProperties: false
      required: [id, name, short_code, description, discord_url, enabled, archived_at, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 2, maxLength: 64 }
        short_code: { type: string, pattern: '^[A-Z0-9]{2,12}$' }
        description: { type: string, maxLength: 4000 }
        discord_url: { type: [string, 'null'] }
        enabled: { type: boolean }
        archived_at: { type: [string, 'null'], format: date-time }
        version: { type: string, pattern: '^(0|[1-9][0-9]*)$' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string, format: uuid }
