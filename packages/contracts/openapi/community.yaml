{
  "openapi": "3.0.3",
  "info": {
    "title": "AnimeOnCraft clan workflows — development",
    "version": "0.5.0-clans-dev",
    "description": "Default-off auth module; loopback development only. External identity/SMTP/HTTPS and production gates remain open. PATCH ClanInput replaces the full allowlisted profile. If-Match on direct admission/manager changes references clan version; removal/leave references membership version. Dashboard is bounded to 100 clans; lists use signed scoped cursors."
