name: animeoncraft-dev

services:
  postgres:
    image: postgres:17.7-bookworm
    environment:
      POSTGRES_DB: animeoncraft
      POSTGRES_USER: anime_migrator
      POSTGRES_PASSWORD: ${AOC_DEV_MIGRATION_DB_PASSWORD:?Set AOC_DEV_MIGRATION_DB_PASSWORD}
      AOC_DEV_APP_DB_PASSWORD: ${AOC_DEV_APP_DB_PASSWORD:?Set AOC_DEV_APP_DB_PASSWORD}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anime_migrator -d animeoncraft"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8.1.10-alpine
    environment:
      AOC_DEV_VALKEY_PASSWORD: ${AOC_DEV_VALKEY_PASSWORD:?Set AOC_DEV_VALKEY_PASSWORD}
    command: ["sh", "-c", "exec valkey-server --appendonly yes --requirepass \"$$AOC_DEV_VALKEY_PASSWORD\""]
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$AOC_DEV_VALKEY_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: infra/compose/backend.Dockerfile
    environment:
      NODE_ENV: development
      AOC_CURSOR_SECRET: ${AOC_CURSOR_SECRET:?Set AOC_CURSOR_SECRET}
      DATABASE_URL: postgresql://anime_app:${AOC_DEV_APP_DB_PASSWORD:?Set AOC_DEV_APP_DB_PASSWORD}@postgres:5432/animeoncraft?schema=public
      VALKEY_URL: redis://default:${AOC_DEV_VALKEY_PASSWORD:?Set AOC_DEV_VALKEY_PASSWORD}@valkey:6379/0
      PUBLIC_HOST: 0.0.0.0
      PUBLIC_PORT: 3000
      INTEGRATION_HOST: 0.0.0.0
      INTEGRATION_PORT: 3001
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 4s
      retries: 12

  proxy:
    profiles: ["app"]
    image: caddy:2.10.2-alpine
    ports:
      - "127.0.0.1:3080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api: { condition: service_healthy }

volumes:
  postgres_data:
  valkey_data:
