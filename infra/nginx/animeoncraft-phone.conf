# Include inside the existing HTTPS server. Existing /api/v1/auth and management
# routes continue to use the main API and its cookie/MFA policy.
location = /admin/phone {
    return 308 /admin/phone/;
}
location = /admin/phone/ {
    root /var/www/animeoncraft-phone;
    try_files /admin/index.html =404;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'" always;
}
location ^~ /admin/assets/ {
    alias /var/www/animeoncraft-phone/admin/assets/;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location ^~ /api/v1/mobile-setup/ {
    proxy_pass http://127.0.0.1:3012;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 8k;
    add_header Cache-Control "no-store" always;
}
